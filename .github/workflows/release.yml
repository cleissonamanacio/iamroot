name: release

# Push a tag (v0.1.0) to build and publish a GitHub Release with:
#   iamroot-linux-amd64, iamroot-linux-arm64, SHA256SUMS, install.sh
# install.sh is attached so it gets a stable
#   /releases/latest/download/install.sh
# URL usable directly by curl | bash.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: verify before shipping
        run: |
          go vet ./...
          go test ./...
          go run ./cmd/iamroot --selftest-py

      - name: build release artifacts
        run: |
          make build-amd64 build-arm64
          cd dist && sha256sum iamroot-linux-* > SHA256SUMS

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/iamroot-linux-amd64
            dist/iamroot-linux-arm64
            dist/SHA256SUMS
            scripts/install.sh
