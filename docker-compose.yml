services:
  iamroot-mirror:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CB_HOST: ${IAMROOT_CB_HOST:-}
    image: iamroot-mirror:latest
    container_name: iamroot-mirror
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./private:/srv/private:ro
