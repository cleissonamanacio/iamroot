services:
  iamroot-mirror:
    build:
      context: .
      dockerfile: Dockerfile
    image: iamroot-mirror:latest
    container_name: iamroot-mirror
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      IAMROOT_SITE: ${IAMROOT_SITE:-}
    volumes:
      - ./private:/srv/private:ro
